name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Jobs run on the self-hosted runner on the owner's PC (WSL Ubuntu + Docker Desktop, since 16 Oct 2026,
# when the GitHub-hosted minutes ran out). Repo variable CI_RUNNER=ubuntu-latest switches back.
jobs:
  check:
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          # read:packages token for @ziadkhaled-wb/contracts on GitHub Packages (.npmrc reads it)
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --maxWorkers=2
      - run: npm run build

      - name: TEST4 known failures
        if: always()
        run: node scripts/test4-known-failures.mjs

  # EC-144: the Playwright e2e suite (RUN_E2E=1) against a real local stack: Supabase built from the
  # API repo's migrations and dev seed, the API on :3001, the Vite dev server on :5173 (started by
  # playwright.config.ts). Local Supabase only: no remote database, local demo keys only.
  # Needs secret API_REPO_TOKEN: a fine-grained token with "Contents: read-only" on
  # ZiadKhaled-wb/EcoFin-API (the API repo is private).
  e2e:
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    timeout-minutes: 30
    env:
      # The API's TEST4 fixture writes through this container (the CI stack, see the slot step).
      SUPABASE_DB_CONTAINER: supabase_db_ecofin-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ZiadKhaled-wb/EcoFin-API
          ref: main
          path: api
          token: ${{ secrets.API_REPO_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Install web dependencies
        run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # API PR #75 supplies the local language fixtures and standalone receipt verifier.
      # After it merges, main contains the fixture and this fallback is no longer used.
      - name: TEST4 API fixture dependency
        working-directory: api
        run: |
          if [ ! -f scripts/test4-language-fixture.mjs ]; then
            git fetch --depth=1 origin 265d70c75cc38f503a42fd5e821d3573540fd313
            git checkout --detach 265d70c75cc38f503a42fd5e821d3573540fd313
          fi
      - name: Install and build the API
        working-directory: api
        run: |
          npm ci
          npm run build

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      # The runner on the owner's PC shares one Docker and Supabase's fixed ports between the API and
      # Web runners: one job at a time holds the local stack (released in the last step, or when the
      # job ends). The stack is named ecofin-ci, never the developer's own ecofin-api stack.
      - name: Wait for the local Supabase slot (stack ecofin-ci)
        working-directory: api
        run: |
          touch "$RUNNER_TEMP/supabase-slot"
          nohup flock /tmp/ecofin-ci-supabase.lock sh -c 'touch "$0.held"; while [ -e "$0" ]; do sleep 2; done' "$RUNNER_TEMP/supabase-slot" > /dev/null 2>&1 &
          until [ -e "$RUNNER_TEMP/supabase-slot.held" ]; do sleep 5; done
          sed -i 's/^project_id = .*/project_id = "ecofin-ci"/' supabase/config.toml
          supabase stop --no-backup > /dev/null 2>&1 || true

      # Auth, PostgREST, Kong, Storage and Mailpit are needed (login, reset email, files).
      - name: Start local Supabase (migrations + dev seed)
        working-directory: api
        run: |
          supabase start -x studio,postgres-meta,imgproxy,edge-runtime,logflare,vector,supavisor,realtime
          supabase db reset

      - name: Local Supabase keys
        working-directory: api
        run: |
          status=$(supabase status -o json)
          field() { node -e 'console.log(JSON.parse(process.argv[1])[process.argv[2]])' "$status" "$1"; }
          {
            echo "SUPABASE_URL=$(field API_URL)"
            echo "SUPABASE_ANON_KEY=$(field ANON_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(field SERVICE_ROLE_KEY)"
          } >> "$GITHUB_ENV"

      # INT-4: the fake ETA (T02's, as a process) on 127.0.0.1 only; the API's job worker sends the
      # receipts there. Never a real ETA host.
      - name: Start the fake ETA on :4010 (controls on :4011)
        working-directory: api
        run: |
          nohup npm run fake-eta > "$RUNNER_TEMP/fake-eta.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4011/admin/state > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "fake ETA did not start"; cat "$RUNNER_TEMP/fake-eta.log"; exit 1

      - name: Start the API on :3001
        working-directory: api
        env:
          NODE_ENV: development
          PORT: '3001'
          ETA_PREPROD_ID_URL: http://127.0.0.1:4010
          ETA_PREPROD_API_URL: http://127.0.0.1:4010
          ETA_PREPROD_PORTAL_URL: https://portal.fake-eta.test
          JOBS_POLL_SECONDS: '5'
          FRONTEND_URL: http://localhost:5173
          LOG_LEVEL: warn
          # Shop and staff invites (INT-2 e2e) go to the local Mailpit.
          SMTP_URL: smtp://127.0.0.1:54325
          MAIL_FROM: EcoFin CI <ci@ecotech.test>
        run: |
          nohup npm start > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/health; then exit 0; fi
            sleep 1
          done
          echo "API did not become healthy"; cat "$RUNNER_TEMP/api.log"; exit 1

      # --with-deps needs sudo apt-get: only on GitHub's runners (the PC has the libraries installed once).
      - name: Install the Playwright browser
        run: npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium

      # Logins: the API repo's dev seed (docs/testing/int-1/LOGINS.md), local-only password.
      - name: e2e (RUN_E2E=1)
        env:
          RUN_E2E: '1'
          VITE_API_URL: ''
          VITE_DEV_API_TARGET: http://localhost:3001
          VITE_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          E2E_API_URL: http://localhost:3001
          E2E_API_DIR: api
          E2E_MAILPIT_URL: http://127.0.0.1:54324
          E2E_OWNER_EMAIL: owner.one@ecotech.test
          E2E_OWNER_PASSWORD: LocalDev-Only-2026!
          E2E_CASHIER_EMAIL: cashier.one@ecotech.test
          E2E_CASHIER_PASSWORD: LocalDev-Only-2026!
          E2E_MULTI_EMAIL: multi.shop@ecotech.test
          E2E_MULTI_PASSWORD: LocalDev-Only-2026!
          E2E_MULTI_SHOP_NAME: Dev Shop Two
          E2E_RESET_EMAIL: owner.two@ecotech.test
          E2E_RESET_PASSWORD: LocalDev-Only-2026!
          E2E_SUPERADMIN_EMAIL: superadmin@ecotech.test
          E2E_SUPERADMIN_PASSWORD: LocalDev-Only-2026!
        run: npx playwright test --workers=2 --reporter=list,html

      - name: Upload test results and API log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/fake-eta.log
          retention-days: 7

      - name: Stop Supabase
        if: always()
        working-directory: api
        run: supabase stop --no-backup

      - name: Release the local Supabase slot
        if: always()
        run: rm -f "$RUNNER_TEMP/supabase-slot"

      - name: TEST4 known failures
        if: always()
        run: node scripts/test4-known-failures.mjs
