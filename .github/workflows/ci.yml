name: CI

on:
  # Docs and specs only (docs/, any .md): nothing to build or test.
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']

permissions:
  contents: read

# A new push to a PR cancels that PR's older run. Runs on main are never cancelled (deploys follow them).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          # read:packages token for @ziadkhaled-wb/contracts on GitHub Packages (.npmrc reads it)
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --maxWorkers=2
      - run: npm run build

      - name: TEST4 known failures
        if: always()
        run: node scripts/test4-known-failures.mjs

  # EC-144: the Playwright e2e suite (RUN_E2E=1) against a real local stack: Supabase built from the
  # API repo's migrations and dev seed, the API on :3001, the Vite dev server on :5173 (started by
  # playwright.config.ts). Local Supabase only: no remote database, local demo keys only.
  # Needs secret API_REPO_TOKEN: a fine-grained token with "Contents: read-only" on
  # ZiadKhaled-wb/EcoFin-API (the API repo is private).
  # Pull requests only: a PR is merged after e2e passed on it, so a push to main runs `check` and
  # does not repeat the e2e suite.
  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # A change that spans both repos (S08) has a branch of the same name in the API repo: the e2e
      # suite runs against it. Any other branch runs against the API's main.
      - name: API branch
        id: api-ref
        env:
          API_REPO_TOKEN: ${{ secrets.API_REPO_TOKEN }}
          BRANCH: ${{ github.head_ref }}
        run: |
          ref=main
          if git ls-remote --exit-code --heads \
              "https://x-access-token:${API_REPO_TOKEN}@github.com/ZiadKhaled-wb/EcoFin-API.git" \
              "refs/heads/$BRANCH" > /dev/null; then
            ref="$BRANCH"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "API ref: $ref"

      - uses: actions/checkout@v4
        with:
          repository: ZiadKhaled-wb/EcoFin-API
          ref: ${{ steps.api-ref.outputs.ref }}
          path: api
          token: ${{ secrets.API_REPO_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Install web dependencies
        run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install and build the API
        working-directory: api
        run: |
          npm ci
          npm run build

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      # Auth, PostgREST, Kong, Storage and Mailpit are needed (login, reset email, files).
      - name: Start local Supabase (migrations + dev seed)
        working-directory: api
        run: |
          supabase start -x studio,postgres-meta,imgproxy,edge-runtime,logflare,vector,supavisor,realtime
          supabase db reset

      - name: Local Supabase keys
        working-directory: api
        run: |
          status=$(supabase status -o json)
          field() { node -e 'console.log(JSON.parse(process.argv[1])[process.argv[2]])' "$status" "$1"; }
          {
            echo "SUPABASE_URL=$(field API_URL)"
            echo "SUPABASE_ANON_KEY=$(field ANON_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(field SERVICE_ROLE_KEY)"
            echo "DATABASE_URL=$(field DB_URL)"
          } >> "$GITHUB_ENV"

      # INT-4: the fake ETA (T02's, as a process) on 127.0.0.1 only; the API's job worker sends the
      # receipts there. Never a real ETA host.
      - name: Start the fake ETA on :4010 (controls on :4011)
        working-directory: api
        run: |
          nohup npm run fake-eta > "$RUNNER_TEMP/fake-eta.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4011/admin/state > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "fake ETA did not start"; cat "$RUNNER_TEMP/fake-eta.log"; exit 1

      - name: Start the API on :3001
        working-directory: api
        env:
          NODE_ENV: development
          PORT: '3001'
          ETA_PREPROD_ID_URL: http://127.0.0.1:4010
          ETA_PREPROD_API_URL: http://127.0.0.1:4010
          ETA_PREPROD_PORTAL_URL: https://portal.fake-eta.test
          JOBS_POLL_SECONDS: '5'
          FRONTEND_URL: http://localhost:5173
          LOG_LEVEL: warn
          # Shop and staff invites (INT-2 e2e) go to the local Mailpit.
          SMTP_URL: smtp://127.0.0.1:54325
          MAIL_FROM: EcoFin CI <ci@ecotech.test>
          # M03 (D86): the full export holds one read-only snapshot through a direct Postgres connection.
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          nohup npm start > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/health; then exit 0; fi
            sleep 1
          done
          echo "API did not become healthy"; cat "$RUNNER_TEMP/api.log"; exit 1

      # The browser download is cached per Playwright version; the system packages install each run.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install the Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install the Playwright system packages
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Logins: the API repo's dev seed (docs/testing/int-1/LOGINS.md), local-only password.
      - name: e2e (RUN_E2E=1)
        env:
          RUN_E2E: '1'
          VITE_API_URL: ''
          VITE_DEV_API_TARGET: http://localhost:3001
          VITE_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          E2E_API_URL: http://localhost:3001
          E2E_API_DIR: api
          E2E_MAILPIT_URL: http://127.0.0.1:54324
          E2E_OWNER_EMAIL: owner.one@ecotech.test
          E2E_OWNER_PASSWORD: LocalDev-Only-2026!
          E2E_CASHIER_EMAIL: cashier.one@ecotech.test
          E2E_CASHIER_PASSWORD: LocalDev-Only-2026!
          E2E_MULTI_EMAIL: multi.shop@ecotech.test
          E2E_MULTI_PASSWORD: LocalDev-Only-2026!
          E2E_MULTI_SHOP_NAME: Dev Shop Two
          E2E_RESET_EMAIL: owner.two@ecotech.test
          E2E_RESET_PASSWORD: LocalDev-Only-2026!
          E2E_SUPERADMIN_EMAIL: superadmin@ecotech.test
          E2E_SUPERADMIN_PASSWORD: LocalDev-Only-2026!
        # Stop after 5 failed tests: a broken PR fails in minutes instead of waiting out every timeout.
        run: npx playwright test --workers=2 --max-failures=5 --reporter=list,html

      - name: Upload test results and API log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/fake-eta.log
          retention-days: 7

      - name: Stop Supabase
        if: always()
        working-directory: api
        run: supabase stop --no-backup

      - name: TEST4 known failures
        if: always()
        run: node scripts/test4-known-failures.mjs
